name: Build Custom Linux ISO

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      distro_name:
        description: 'Distro Name'
        required: true
        default: 'DellOS-5301'
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      upload_gdrive:
        description: 'Upload to Google Drive? (Requires RCLONE_CONFIG secret)'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build Debian GNOME Live ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gettext po4a \
            debian-archive-keyring \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rclone \
            curl \
            jq
          # Install latest upstream Debian live-build from official Salsa repository
          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/live-build
          cd /tmp/live-build && sudo make install

      - name: Configure live-build
        run: |
          mkdir -p build && cd build
          
          # Initialize live-build configuration explicitly in Debian mode
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --parent-distribution bookworm \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --parent-mirror-bootstrap "http://deb.debian.org/debian/" \
            --parent-mirror-chroot "http://deb.debian.org/debian/" \
            --parent-mirror-binary "http://deb.debian.org/debian/" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --parent-archive-areas "main contrib non-free non-free-firmware" \
            --architectures amd64 \
            --linux-flavours amd64 \
            --binary-images iso-hybrid \
            --bootloader grub-efi \
            --memtest none \
            --system live \
            --security false \
            --apt-indices false \
            --apt-recommends true \
            --iso-application "${{ inputs.distro_name || 'DellOS-5301' }}" \
            --iso-publisher "Custom OS Builder" \
            --iso-volume "${{ inputs.distro_name || 'DellOS-5301' }}-$(date +%Y%m%d)"

          # Copy custom package lists
          sudo mkdir -p config/package-lists
          sudo cp -r ../config/package-lists/* config/package-lists/

          # Copy custom filesystem includes (branding, configs, skel)
          if [ -d "../config/includes.chroot" ]; then
            sudo mkdir -p config/includes.chroot
            sudo cp -r ../config/includes.chroot/* config/includes.chroot/
          fi

          # Copy custom chroot hooks
          if [ -d "../config/hooks" ]; then
            sudo mkdir -p config/hooks
            sudo cp -r ../config/hooks/* config/hooks/
          fi

      - name: Build ISO
        run: |
          cd build
          set -o pipefail
          echo "=== Starting ISO Build ==="
          sudo lb build 2>&1 | tee build.log

      - name: Prepare Artifacts & Checksums
        id: prepare
        run: |
          cd build
          ISO_FILE=$(ls *.iso 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: ISO file was not generated! Printing tail of build.log:"
            tail -n 100 build.log
            exit 1
          fi

          DIST_NAME="${{ inputs.distro_name || 'DellOS-5301' }}"
          FINAL_NAME="${DIST_NAME}-$(date +%Y%m%d)-amd64.iso"
          sudo mv "$ISO_FILE" "$FINAL_NAME"

          echo "Generating SHA256 checksum..."
          sha256sum "$FINAL_NAME" > "${FINAL_NAME}.sha256"

          ls -lh "$FINAL_NAME" "${FINAL_NAME}.sha256"

          echo "iso_path=build/${FINAL_NAME}" >> $GITHUB_OUTPUT
          echo "iso_name=${FINAL_NAME}" >> $GITHUB_OUTPUT
          echo "checksum_path=build/${FINAL_NAME}.sha256" >> $GITHUB_OUTPUT

      - name: Upload ISO to Google Drive (via rclone)
        if: ${{ inputs.upload_gdrive == true }}
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG_DATA" ]; then
            echo "Configuring rclone..."
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
            
            echo "Uploading ${{ steps.prepare.outputs.iso_name }} to Google Drive..."
            rclone copy "${{ steps.prepare.outputs.iso_path }}" gdrive:CustomOS-ISOs/ --progress
            rclone copy "${{ steps.prepare.outputs.checksum_path }}" gdrive:CustomOS-ISOs/ --progress
            echo "Google Drive upload completed successfully!"
          else
            echo "Notice: RCLONE_CONFIG secret is not configured. Skipping Google Drive upload."
          fi

      - name: Upload Single ISO to GitHub Actions Artifacts (Up to 10 GB)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.iso_name }}
          path: ${{ steps.prepare.outputs.iso_path }}
          retention-days: 30

      - name: Split Large ISO for GitHub Releases (Bypasses GitHub 2GB Limit)
        run: |
          cd build
          FINAL_NAME="${{ steps.prepare.outputs.iso_name }}"
          echo "Splitting 3.5GB ISO into <2GB chunks for GitHub Releases..."
          split -b 1800M "$FINAL_NAME" "${FINAL_NAME}.part-"
          ls -lh ${FINAL_NAME}.part-*

      - name: Create GitHub Release & Upload Assets (via official gh CLI)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build
          TAG_NAME="${{ inputs.release_tag || format('v1.0.{0}', github.run_number) }}"
          DIST_NAME="${{ inputs.distro_name || 'DellOS-5301' }}"
          FINAL_NAME="${{ steps.prepare.outputs.iso_name }}"

          cat <<'EOF' > release_notes.md
          ## 🚀 Futuristic Dell Inspiron 5301 Custom Linux Release
          - **Target Laptop:** Dell Inspiron 5301 (11th Gen Core i5, Iris Xe Graphics, 8GB RAM)
          - **Base OS:** Debian 12 Bookworm (Stable) + GNOME Wayland
          - **Memory Optimization:** 100% ZRAM (zstd) + EarlyOOM (~14GB usable RAM)
          - **Android Support:** Waydroid (native GPU-accelerated container) + Scrcpy (60fps screen mirror) + GSConnect
          - **Windows Support:** Wine (32-bit & 64-bit multiarch) + Flathub Bottles
          - **Futuristic Suite:** Starship prompt, Kitty terminal (frosted glass), Cava audio visualizer, Cmatrix, Hollywood HUD, Ollama AI engine

          ---

          ### 📥 How to Reassemble the ISO (Due to GitHub 2GB File Limit)
          Download all `.part-` files and run one command to join them:
          
          **On Linux / macOS:**
          ```bash
          cat DellOS-5301-*.part-* > DellOS-5301.iso
          ```
          
          **On Windows (Command Prompt):**
          ```cmd
          copy /b DellOS-5301-*.part-* DellOS-5301.iso
          ```

          ### Verification Checksum
          ```bash
          sha256sum -c DellOS-5301-*.sha256
          ```
          EOF

          # Delete existing release/tag with same name if already exists
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true

          echo "Publishing release $TAG_NAME to GitHub Releases..."
          gh release create "$TAG_NAME" \
            ${FINAL_NAME}.part-* "${FINAL_NAME}.sha256" \
            --title "${DIST_NAME} ${TAG_NAME}" \
            --notes-file release_notes.md
