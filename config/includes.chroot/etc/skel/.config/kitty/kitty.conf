# Futuristic Cyberpunk Kitty Configuration

# Font
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Sci-Fi Translucent Frosted Glass
background_opacity 0.85
dynamic_background_opacity yes

# Cursor Animation & Trail
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.1 0.4

# Window & Padding
window_padding_width 12
confirm_os_window_close 0

# Colors (Nordic Cyber Neon)
background #0d1117
foreground #c9d1d9
cursor #58a6ff
color0  #161b22
color1  #ff7b72
color2  #3fb950
color3  #d29922
color4  #58a6ff
color5  #bc8cff
color6  #39c5cf
color7  #b1bac4
color8  #484f58
color9  #ffa198
color10 #56d364
color11 #e3b341
color12 #79c0ff
color13 #d2a8ff
color14 #56d4dd
color15 #f0f6fc
