# Dell Inspiron 5301 - 8GB RAM + ZRAM Memory Optimization

# Swappiness of 180 tells the kernel to aggressively use fast ZRAM compressed memory 
# instead of dropping active disk caches, effectively turning 8GB into ~14GB usable RAM.
vm.swappiness = 180

# Keep inode and dentry caches in memory
vm.vfs_cache_pressure = 50

# Page cluster 0 disables page read-ahead for swap, optimal for ZRAM in-memory swap
vm.page-cluster = 0

# Lower dirty memory ratios to prevent stutter during heavy I/O
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
